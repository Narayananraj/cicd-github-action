name: Build Android TV

on:
  push:
    tags: ["tv-*"]
  workflow_dispatch:

env:
  ANDROIDTV_PACKAGE_NAME: vgts.lmes.chessprime

jobs:
  build-androidtv:
    timeout-minutes: 30
    name: Build Chess Prime Android TV
    runs-on: depot-ubuntu-22.04-16
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Cache Gradle wrapper + dependency caches keyed off the wrapper
      # properties and build files — cuts repeat-run time (and Depot minute
      # cost) once the dependency graph is unchanged.
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-tv-${{ hashFiles('packages/androidtv/**/*.gradle*', 'packages/androidtv/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-tv-

      - name: Generate Gradle wrapper
        working-directory: packages/androidtv
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROIDTV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROIDTV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROIDTV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROIDTV_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          MISSING=()
          [ -z "$KEYSTORE_BASE64" ] && MISSING+=("ANDROIDTV_KEYSTORE_BASE64")
          [ -z "$KEYSTORE_PASSWORD" ] && MISSING+=("ANDROIDTV_KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && MISSING+=("ANDROIDTV_KEY_ALIAS")
          [ -z "$KEY_PASSWORD" ] && MISSING+=("ANDROIDTV_KEY_PASSWORD")
          [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ] && MISSING+=("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${MISSING[*]}"
            exit 1
          fi
          echo "All required secrets present."

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROIDTV_KEYSTORE_BASE64 }}
        working-directory: packages/androidtv
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks

      - name: Build release AAB and APK
        id: build
        working-directory: packages/androidtv
        env:
          ANDROIDTV_KEYSTORE_PASSWORD: ${{ secrets.ANDROIDTV_KEYSTORE_PASSWORD }}
          ANDROIDTV_KEY_ALIAS: ${{ secrets.ANDROIDTV_KEY_ALIAS }}
          ANDROIDTV_KEY_PASSWORD: ${{ secrets.ANDROIDTV_KEY_PASSWORD }}
        run: |
          # Append a release signingConfig that reads from env. Kept
          # in CI rather than build.gradle.kts so a misconfigured local
          # build never accidentally signs with prod creds.
          cat >> app/build.gradle.kts << 'EOF'
          android.signingConfigs {
              create("release") {
                  storeFile = file("release.jks")
                  storePassword = System.getenv("ANDROIDTV_KEYSTORE_PASSWORD")
                  keyAlias = System.getenv("ANDROIDTV_KEY_ALIAS")
                  keyPassword = System.getenv("ANDROIDTV_KEY_PASSWORD")
              }
          }
          android.buildTypes.getByName("release").signingConfig =
              android.signingConfigs.getByName("release")
          EOF
          ./gradlew bundleRelease assembleRelease --no-daemon

          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)
          test -n "$APK_FILE" || { echo "::error::No APK produced"; exit 1; }
          test -n "$AAB_FILE" || { echo "::error::No AAB produced"; exit 1; }
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "aab_file=$AAB_FILE" >> "$GITHUB_OUTPUT"

      - name: Checksum build outputs
        working-directory: packages/androidtv
        run: |
          sha256sum "${{ steps.build.outputs.apk_file }}" "${{ steps.build.outputs.aab_file }}" \
            | tee build/outputs/SHA256SUMS.txt
          echo "### Build checksums" >> "$GITHUB_STEP_SUMMARY"
          cat build/outputs/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      # Delete the decoded keystore from the runner disk regardless of build
      # outcome — Depot runners are ephemeral but this avoids leaving signing
      # material around for the rest of the job if a later step fails.
      - name: Remove decoded keystore
        if: always()
        working-directory: packages/androidtv
        run: rm -f app/release.jks

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: chessprime-androidtv-apk
          path: packages/androidtv/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v5
        with:
          name: chessprime-androidtv-aab
          path: packages/androidtv/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v5
        with:
          name: chessprime-androidtv-checksums
          path: packages/androidtv/build/outputs/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish to Google Play (Internal Testing)
        id: play-store-upload
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROIDTV_PACKAGE_NAME }}
          releaseFiles: packages/androidtv/app/build/outputs/bundle/release/*.aab
          tracks: internal
          status: completed
          changesNotSentForReview: true

      # --- Slack: success ---
      - name: Notify Slack - success
        if: success()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "attachments": [{
                "color": "#22c55e",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*✅ Android TV build succeeded — Chess Prime*\n*Tag:* ${{ github.ref_name }}\n*Package:* `${{ env.ANDROIDTV_PACKAGE_NAME }}`\n*Play upload:* ${{ steps.play-store-upload.outcome }}\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                    }
                  }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      # --- Slack: failure ---
      - name: Notify Slack - failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "attachments": [{
                "color": "#ef4444",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*❌ Android TV build failed — Chess Prime*\n*Tag:* ${{ github.ref_name }}\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs — check which step failed>"
                    }
                  }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK