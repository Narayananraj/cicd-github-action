name: Build iOS

on:
  push:
    tags:
      - 'ios-v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy iOS
    runs-on: [self-hosted, macos-inhouse]
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      IOS_PROJECT: ChessPrimeMobile.xcodeproj
      IOS_SCHEME: ChessPrimeMobile
      IOS_BUNDLE_IDENTIFIER: com.chessprime.meet
      IOS_BROADCAST_BUNDLE_IDENTIFIER: com.chessprime.meet.broadcast
      IOS_SHARE_BUNDLE_IDENTIFIER: com.chessprime.meet.share
      APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM || secrets.APPLE_TEAM_ID }}
      CHESSPRIME_API_BASE_URL: ${{ vars.CHESSPRIME_API_BASE_URL || 'https://meet.chessprime.app' }}
      CHESSPRIME_REALTIME_BASE_URL: ${{ vars.CHESSPRIME_REALTIME_BASE_URL || 'https://realtime.chessprime.app' }}
      CHESSPRIME_LIVEKIT_URL: ${{ vars.CHESSPRIME_LIVEKIT_URL || 'wss://rtc.chessprime.tech' }}
      CHESSPRIME_GOOGLE_AUTH_REDIRECT_URI: ${{ vars.CHESSPRIME_GOOGLE_AUTH_REDIRECT_URI || 'app.chessprime.meet://auth/google' }}
    defaults:
      run:
        working-directory: apps/ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Setup iOS platform
        run: |
          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch

          echo "=== Xcode Version ==="
          xcodebuild -version
          echo "=== Selected Xcode ==="
          xcode-select -p
          echo "=== Available SDKs ==="
          xcodebuild -showsdks

          echo "=== Downloading iOS Platform ==="
          for i in 1 2 3; do
            xcodebuild -downloadPlatform iOS && break
            echo "Attempt $i failed, retrying in 15 seconds..."
            sleep 15
          done

          echo "=== Verifying iOS SDK ==="
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install xcpretty
        run: command -v xcpretty || sudo gem install -n /usr/local/bin xcpretty

      - name: Clean stale signing keychain
        run: |
          security delete-keychain signing_temp.keychain-db 2>/dev/null || true
          rm -f ~/Library/Keychains/signing_temp.keychain-db

      - name: Validate iOS deploy configuration
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BROADCAST_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BROADCAST_BASE64 }}
          APPLE_PROVISIONING_PROFILE_SHARE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_SHARE_BASE64 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPLE_API_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPLE_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY || secrets.APPLE_API_KEY }}
        run: |
          test -n "$APPLE_DEVELOPMENT_TEAM" || { echo "Missing repo variable APPLE_DEVELOPMENT_TEAM"; exit 1; }
          test -n "$CHESSPRIME_API_BASE_URL" || { echo "Missing repo variable CHESSPRIME_API_BASE_URL"; exit 1; }
          test -n "$CHESSPRIME_REALTIME_BASE_URL" || { echo "Missing repo variable CHESSPRIME_REALTIME_BASE_URL"; exit 1; }
          test -n "$CHESSPRIME_LIVEKIT_URL" || { echo "Missing repo variable CHESSPRIME_LIVEKIT_URL"; exit 1; }
          test -n "$APPLE_CERTIFICATE_BASE64" || { echo "Missing secret APPLE_CERTIFICATE_BASE64"; exit 1; }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo "Missing secret APPLE_CERTIFICATE_PASSWORD"; exit 1; }
          test -n "$APPLE_PROVISIONING_PROFILE_BASE64" || { echo "Missing secret APPLE_PROVISIONING_PROFILE_BASE64"; exit 1; }
          test -n "$APPLE_PROVISIONING_PROFILE_BROADCAST_BASE64" || { echo "Missing secret APPLE_PROVISIONING_PROFILE_BROADCAST_BASE64"; exit 1; }
          test -n "$APPLE_PROVISIONING_PROFILE_SHARE_BASE64" || { echo "Missing secret APPLE_PROVISIONING_PROFILE_SHARE_BASE64"; exit 1; }
          test -n "$APP_STORE_CONNECT_ISSUER_ID" || { echo "Missing secret APP_STORE_CONNECT_ISSUER_ID"; exit 1; }
          test -n "$APP_STORE_CONNECT_KEY_ID" || { echo "Missing secret APP_STORE_CONNECT_KEY_ID"; exit 1; }
          test -n "$APP_STORE_CONNECT_API_KEY" || { echo "Missing secret APP_STORE_CONNECT_API_KEY"; exit 1; }

      - name: Import code signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profiles
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BROADCAST_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BROADCAST_BASE64 }}
          APPLE_PROVISIONING_PROFILE_SHARE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_SHARE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          # Main app profile.
          MAIN_PATH="$RUNNER_TEMP/chessprime-main.mobileprovision"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$MAIN_PATH"
          MAIN_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$MAIN_PATH")")
          mv "$MAIN_PATH" "$PROFILE_DIR/$MAIN_UUID.mobileprovision"
          echo "PROVISIONING_PROFILE_UUID=$MAIN_UUID" >> "$GITHUB_ENV"

          # Broadcast extension profile (separate App ID, same App Group).
          BCAST_PATH="$RUNNER_TEMP/chessprime-broadcast.mobileprovision"
          echo "$APPLE_PROVISIONING_PROFILE_BROADCAST_BASE64" | base64 --decode > "$BCAST_PATH"
          BCAST_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$BCAST_PATH")")
          mv "$BCAST_PATH" "$PROFILE_DIR/$BCAST_UUID.mobileprovision"
          echo "PROVISIONING_PROFILE_BROADCAST_UUID=$BCAST_UUID" >> "$GITHUB_ENV"

          # Share extension profile (separate App ID, same App Group).
          SHARE_PATH="$RUNNER_TEMP/chessprime-share.mobileprovision"
          echo "$APPLE_PROVISIONING_PROFILE_SHARE_BASE64" | base64 --decode > "$SHARE_PATH"
          SHARE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$SHARE_PATH")")
          mv "$SHARE_PATH" "$PROFILE_DIR/$SHARE_UUID.mobileprovision"
          echo "PROVISIONING_PROFILE_SHARE_UUID=$SHARE_UUID" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME"

      - name: Archive iOS app
        run: |
          xcodebuild archive \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath "build/$IOS_SCHEME.xcarchive" \
            APPLE_DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM" \
            PROVISIONING_PROFILE_UUID="$PROVISIONING_PROFILE_UUID" \
            PROVISIONING_PROFILE_BROADCAST_UUID="$PROVISIONING_PROFILE_BROADCAST_UUID" \
            PROVISIONING_PROFILE_SHARE_UUID="$PROVISIONING_PROFILE_SHARE_UUID" \
            CHESSPRIME_API_BASE_URL="$CHESSPRIME_API_BASE_URL" \
            CHESSPRIME_REALTIME_BASE_URL="$CHESSPRIME_REALTIME_BASE_URL" \
            CHESSPRIME_LIVEKIT_URL="$CHESSPRIME_LIVEKIT_URL" \
            CHESSPRIME_GOOGLE_AUTH_REDIRECT_URI="$CHESSPRIME_GOOGLE_AUTH_REDIRECT_URI"

      - name: Export IPA
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_DEVELOPMENT_TEAM</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$IOS_BUNDLE_IDENTIFIER</key>
              <string>$PROVISIONING_PROFILE_UUID</string>
              <key>$IOS_BROADCAST_BUNDLE_IDENTIFIER</key>
              <string>$PROVISIONING_PROFILE_BROADCAST_UUID</string>
              <key>$IOS_SHARE_BUNDLE_IDENTIFIER</key>
              <string>$PROVISIONING_PROFILE_SHARE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "build/$IOS_SCHEME.xcarchive" \
            -exportPath build/output \
            -exportOptionsPlist ExportOptions.plist

          IPA_FILE=$(find build/output -name "*.ipa" -type f | head -1)
          test -n "$IPA_FILE" || { echo "No IPA was produced"; exit 1; }
          echo "IPA_FILE=$IPA_FILE" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: ios-ipa-${{ github.run_number }}
          path: apps/ios/build/output/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: apps/ios/${{ env.IPA_FILE }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPLE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPLE_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY || secrets.APPLE_API_KEY }}